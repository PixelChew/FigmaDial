<!doctype html>
<html>
	<head lang="en">
		<title>Figma shortcut settings</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Shortcut">
			<sdpi-select setting="shortcut" default="pasteOverSelection">
				<option value="pasteOverSelection">Paste in place (⇧⌘V)</option>
				<option value="pasteToReplace">Paste to replace (⇧⌘R)</option>
				<option value="copyProperties">Copy properties (⌥⌘C)</option>
				<option value="pasteProperties">Paste properties (⌥⌘V)</option>
				<option value="copyAsPng">Copy as PNG (⇧⌘C)</option>
				<option value="frameSelection">Frame selection (⌥⌘G)</option>
				<option value="autoLayout">Add auto layout (⇧A)</option>
				<option value="group">Group (⌘G)</option>
				<option value="ungroup">Ungroup (⇧⌘G)</option>
				<option value="createComponent">Create component (⌥⌘K)</option>
				<option value="detachInstance">Detach instance (⌥⌘B)</option>
				<option value="toggleUi">Show/hide UI (⌘\)</option>
				<option value="runLastPlugin">Run last plugin (⌥⌘P)</option>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>
